name: iOS Simulator launch check
on:
  push:
    branches: [ios-smoke]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      NO_FLIPPER: '1'
      RCT_NEW_ARCH_ENABLED: '0'
      FORCE_BUNDLING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec pod install
        working-directory: ios
      - name: Build release for Simulator
        run: |
          mkdir -p build/smoke
          xcodebuild -workspace ios/VirtusPlanner.xcworkspace -scheme VirtusPlanner \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/smoke/DerivedData CODE_SIGNING_ALLOWED=NO \
            build > build/smoke/build.log 2>&1
      - name: Verify standalone launch
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl create VirtusPlannerSmoke 'iPhone 15' 'iOS 17.5')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=build/smoke/DerivedData/Build/Products/Release-iphonesimulator/VirtusPlanner.app
          test -s "$APP/main.jsbundle"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.virtusplanner.app | tee build/smoke/launch.txt
          sleep 15
          xcrun simctl spawn "$DEVICE" launchctl list > build/smoke/processes.txt
          awk '$3 ~ /com\.virtusplanner\.app/ && $1 ~ /^[0-9]+$/ { found=1 } END { exit !found }' build/smoke/processes.txt
          xcrun simctl io "$DEVICE" screenshot build/smoke/launch.png
          xcrun simctl spawn "$DEVICE" log show --last 1m --style compact \
            --predicate 'process == "VirtusPlanner"' > build/smoke/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-smoke
          path: |
            build/smoke/*.log
            build/smoke/*.txt
            build/smoke/*.png
          retention-days: 7
